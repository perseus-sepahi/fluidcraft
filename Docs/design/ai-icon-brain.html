<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Brain Icons</title>
<style>
  :root { --bg: #f6f5f3; --card: #ffffff; --ink: #1d1d1f; --muted: #6e6e73; --accent: #ee7f22; --line: #e4e2de; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #1b1b1d; --card: #262628; --ink: #f2f2f4; --muted: #a1a1a6; --line: #3a3a3d; } }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif; }
  main { max-width: 1100px; margin: 0 auto; padding: 28px 16px 48px; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  p.lead { color: var(--muted); margin: 0 0 24px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 16px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px; }
  .card h2 { font-size: 15px; margin: 0 0 2px; }
  .card .why { color: var(--muted); font-size: 12.5px; margin: 0 0 12px; min-height: 36px; }
  .row { display: flex; align-items: center; gap: 14px; }
  .big { width: 112px; height: 112px; color: var(--accent); flex: none; }
  .sizes { display: grid; grid-template-columns: auto auto; gap: 8px 10px; align-items: center; }
  .chip { display: flex; align-items: center; gap: 8px; padding: 6px 10px; border-radius: 8px; font-size: 12px; }
  .chip.light { background: #ececec; color: #3a3a3c; }
  .chip.light.sel { color: var(--accent); background: #f3e6da; }
  .chip.dark { background: #2c2c2e; color: #d8d8dc; }
  .chip.dark.sel { color: #ff9a3c; background: #3d3127; }
  .chip svg { width: 22px; height: 22px; }
  .tiny svg { width: 16px; height: 16px; }
  .letter { font-weight: 700; color: var(--accent); margin-right: 4px; }
  svg { display: block; overflow: visible; }
</style>
</head>

<script>
const options = [
  ["G", "Brain with a network inside", "A side-view brain outline holding a small neural network: the classic AI brain, clean at every size."],
  ["H", "Half brain, half network", "The left half is a brain with folds; across the midline it turns into nodes and links. Thinking becomes computing."],
  ["I", "Constellation brain", "No outline at all: the brain's shape is traced by connected nodes, like a star map. The lightest and most modern."],
  ["J", "Two hemispheres", "Top view: one hemisphere has folds, the other circuit traces ending in nodes. Symmetric and very readable at 16 pt."],
  ["K", "Flow brain", "The brain's folds are streamlines that end in nodes: an AI that thinks in flow. Ties the icon to CFD."],
];
const use = id => `<svg viewBox="0 0 64 64"><use href="#${id}"/></svg>`;
document.getElementById("grid").innerHTML = options.map(([id, name, why]) => `
  <section class="card">
    <h2><span class="letter">${id}</span>${name}</h2>
    <p class="why">${why}</p>
    <div class="row">
      <div class="big">${use(id)}</div>
      <div class="sizes">
        <div class="chip light">${use(id)}AI</div><div class="chip light sel">${use(id)}AI</div>
        <div class="chip dark">${use(id)}AI</div><div class="chip dark sel">${use(id)}AI</div>
        <div class="chip light tiny">${use(id)}16 pt</div><div class="chip dark tiny">${use(id)}16 pt</div>
      </div>
    </div>
  </section>`).join("");
</script>
