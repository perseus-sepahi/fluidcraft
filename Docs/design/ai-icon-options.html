<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Icon Options</title>
<style>
  :root { --bg: #f6f5f3; --card: #ffffff; --ink: #1d1d1f; --muted: #6e6e73; --accent: #ee7f22; --line: #e4e2de; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #1b1b1d; --card: #262628; --ink: #f2f2f4; --muted: #a1a1a6; --line: #3a3a3d; } }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif; }
  main { max-width: 1100px; margin: 0 auto; padding: 28px 16px 48px; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  p.lead { color: var(--muted); margin: 0 0 24px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 16px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px; }
  .card h2 { font-size: 15px; margin: 0 0 2px; }
  .card .why { color: var(--muted); font-size: 12.5px; margin: 0 0 12px; min-height: 36px; }
  .row { display: flex; align-items: center; gap: 14px; }
  .big { width: 112px; height: 112px; color: var(--accent); flex: none; }
  .sizes { display: grid; grid-template-columns: auto auto; gap: 8px 10px; align-items: center; }
  .chip { display: flex; align-items: center; gap: 8px; padding: 6px 10px; border-radius: 8px; font-size: 12px; }
  .chip.light { background: #ececec; color: #3a3a3c; }
  .chip.light.sel { color: var(--accent); background: #f3e6da; }
  .chip.dark { background: #2c2c2e; color: #d8d8dc; }
  .chip.dark.sel { color: #ff9a3c; background: #3d3127; }
  .chip svg { width: 22px; height: 22px; }
  .tiny svg { width: 16px; height: 16px; }
  .letter { font-weight: 700; color: var(--accent); margin-right: 4px; }
  svg { display: block; overflow: visible; }
</style>
</head>
<body>
<main>
  <h1>AI assistant icon — options</h1>
  <p class="lead">Original drawings for FluidCraft's AI tab and assistant button. Each is shown large, at Settings-tab size (22 pt) and at 16 pt, unselected and selected, in light and dark.</p>

  <svg width="0" height="0" style="position:absolute">
    <defs>
      <!-- A: fluidcraft head in a speech bubble -->
      <symbol id="A" viewBox="0 0 64 64">
        <path d="M18 8 H46 A12 12 0 0 1 58 20 V34 A12 12 0 0 1 46 46 H27 L14 56 L16.5 46 A10.5 10.5 0 0 1 6 35.5 V20 A12 12 0 0 1 18 8 Z" fill="none" stroke="currentColor" stroke-width="4" stroke-linejoin="round"/>
        <path fill="currentColor" fill-rule="evenodd" d="M18 25 a6.5 6.5 0 1 0 13 0 a6.5 6.5 0 1 0 -13 0 Z M25.2 23.2 a1.5 1.5 0 1 0 3 0 a1.5 1.5 0 1 0 -3 0 Z"/>
        <path fill="currentColor" d="M29.5 22.4 C38 22 45 25.5 50.5 36.5 C44 30.2 38 27.8 30.2 28 Z"/>
        <path d="M21.5 30.5 C20 36 22 41.5 28.5 46" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round"/>
      </symbol>
      <!-- B: the head is the bubble, the bill is its tail -->
      <symbol id="B" viewBox="0 0 64 64">
        <path d="M42.6 38.2 A19 19 0 1 1 45.9 26.2" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round"/>
        <path fill="currentColor" d="M44 23.6 C52.5 24.6 58.6 32 61 45.5 C55.5 38.4 50.2 35.6 41.6 39.6 C44.6 34.4 45.4 29 44 23.6 Z"/>
        <circle cx="35" cy="19.5" r="2.7" fill="currentColor"/>
        <circle cx="17.5" cy="31" r="2.3" fill="currentColor"/>
        <circle cx="25" cy="31" r="2.3" fill="currentColor"/>
        <circle cx="32.5" cy="31" r="2.3" fill="currentColor"/>
      </symbol>
      <!-- C: "C" monogram that turns into the bill -->
      <symbol id="C" viewBox="0 0 64 64">
        <path d="M40.7 44.7 A18 18 0 1 1 40.7 19.3" fill="none" stroke="currentColor" stroke-width="5.5" stroke-linecap="round"/>
        <path fill="currentColor" d="M42.7 17.3 C51.5 18.6 57.4 26 60.6 39.5 C55 31.2 47.6 25 38.7 21.3 Z"/>
        <circle cx="32.5" cy="25.5" r="3" fill="currentColor"/>
      </symbol>
      <!-- D: fluidcraft head with streamlines passing under the bill -->
      <symbol id="D" viewBox="0 0 64 64">
        <path fill="currentColor" fill-rule="evenodd" d="M11 20 a8 8 0 1 0 16 0 a8 8 0 1 0 -16 0 Z M19.6 17.6 a1.8 1.8 0 1 0 3.6 0 a1.8 1.8 0 1 0 -3.6 0 Z"/>
        <path fill="currentColor" d="M25.5 16.6 C37 16 48 21 56.5 35.5 C46.5 27 37.5 23.8 26.4 24 Z"/>
        <path d="M15 27 C13.5 32 14.5 37 18.5 41.5" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round"/>
        <path d="M4 44 C18 41 28 40.5 38 43 S54 48 61 45" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round"/>
        <path d="M4 54 C20 51.5 34 51 46 53.5 S57 56 61 55" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round"/>
      </symbol>
      <!-- E: wading fluidcraft, thinking -->
      <symbol id="E" viewBox="0 0 64 64">
        <path fill="currentColor" d="M43.5 33.5 C43.5 39.5 35.5 43 26 43 C19 43 12.5 40.5 3.5 30 C11.5 31.5 14 27.5 20 25.8 C25 24.3 33.5 24.2 38 26.6 C41.5 28.5 43.5 30.6 43.5 33.5 Z"/>
        <path d="M38.5 28 C41.5 22.5 42.5 18.5 45.5 15.5" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round"/>
        <circle cx="47" cy="13.5" r="4.6" fill="currentColor"/>
        <path fill="currentColor" d="M50.6 11.8 C55.6 12.6 58.8 16.6 61 24.5 C57.8 19.4 54.6 16.9 50.8 15.7 Z"/>
        <path d="M27 43 L26 59 M32.5 42 L35.5 59" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/>
        <circle cx="21" cy="12" r="2.3" fill="currentColor"/>
        <circle cx="28.5" cy="12" r="2.3" fill="currentColor"/>
        <circle cx="36" cy="12" r="2.3" fill="currentColor" opacity="0.5"/>
      </symbol>
      <!-- F: speech bubble made of flow -->
      <symbol id="F" viewBox="0 0 64 64">
        <path d="M18 8 H46 A12 12 0 0 1 58 20 V34 A12 12 0 0 1 46 46 H27 L14 56 L16.5 46 A10.5 10.5 0 0 1 6 35.5 V20 A12 12 0 0 1 18 8 Z" fill="none" stroke="currentColor" stroke-width="4" stroke-linejoin="round"/>
        <path d="M15 20.5 H36.5 a4.6 4.6 0 1 0 -4.6 -4.6" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round"/>
        <path d="M15 28 H48" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round"/>
        <path d="M15 35.5 H32.5 a4.2 4.2 0 1 1 -4.2 4.2" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round"/>
      </symbol>
    </defs>
  </svg>

  <div class="grid" id="grid"></div>
</main>
<script>
const options = [
  ["A", "FluidCraft in a speech bubble", "A fluidcraft's head with its long down-curved bill, speaking. Reads as “ask FluidCraft”."],
  ["B", "The bill is the tail", "The head is the chat bubble and the bill is its tail; the dots say it is answering."],
  ["C", "C for FluidCraft", "A bold “C” whose top stroke becomes the bill. Doubles as a brand mark."],
  ["D", "FluidCraft over streamlines", "The bird with flow passing under the bill: the assistant that knows CFD."],
  ["E", "Wading fluidcraft, thinking", "The full bird with thinking dots. Friendliest, but busiest at small sizes."],
  ["F", "Bubble of flow", "A chat bubble filled with streamlines: CFD conversation, no bird."],
];
const use = id => `<svg viewBox="0 0 64 64"><use href="#${id}"/></svg>`;
document.getElementById("grid").innerHTML = options.map(([id, name, why]) => `
  <section class="card">
    <h2><span class="letter">${id}</span>${name}</h2>
    <p class="why">${why}</p>
    <div class="row">
      <div class="big">${use(id)}</div>
      <div class="sizes">
        <div class="chip light">${use(id)}AI</div><div class="chip light sel">${use(id)}AI</div>
        <div class="chip dark">${use(id)}AI</div><div class="chip dark sel">${use(id)}AI</div>
        <div class="chip light tiny">${use(id)}16 pt</div><div class="chip dark tiny">${use(id)}16 pt</div>
      </div>
    </div>
  </section>`).join("");
</script>
</body>
</html>
